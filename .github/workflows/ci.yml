name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Hexwaste.slnx -c Release
      # The data-backed tests self-skip when FALLOUT2_DIR is unset
      # (tests/Hexwaste.Formats.Tests/GameDataFactAttribute.cs). Game data is
      # never committed or fetched in CI — legal guardrail — so CI runs the
      # data-free split only. The perf canary needs a GPU + game data; it stays
      # a local pre-tag check (see docs/RELEASING.md).
      - name: Test (data-free split)
        run: dotnet test tests/Hexwaste.Formats.Tests -c Release --no-build --logger "console;verbosity=normal"
